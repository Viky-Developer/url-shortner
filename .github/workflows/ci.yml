name: CI

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**']
  pull_request:

jobs:
  ci:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup sqlc
        uses: sqlc-dev/setup-sqlc@v2
        with:
          sqlc-version: "1.31.1"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout 5m

      - name: gofmt
        run: |
          gofmt -l .
          gofmt -w .

      - name: goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          goimports -l .

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: sqlc generate
        run: |
          sqlc generate
          git diff --exit-code internal/db/gen

      - name: Test
        run: go test ./...